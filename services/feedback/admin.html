<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>无尽战区 · 反馈管理</title>
<style>body{font:16px system-ui;background:#071323;color:#dce8f7;max-width:960px;margin:40px auto;padding:20px}input,select,button{font:inherit;padding:10px;background:#14283b;color:inherit;border:1px solid #356078;border-radius:6px}button{cursor:pointer}article{background:#112236;padding:20px;margin:18px 0;border-radius:12px}p{white-space:pre-wrap}img{width:180px;max-height:160px;object-fit:contain;margin:5px}#message{color:#7cddf6}</style>
<h1>问题反馈管理</h1><form id="login"><input type="password" id="password" placeholder="管理口令" autocomplete="current-password" required><button>进入管理</button></form><p id="message" role="status"></p><section id="reports"></section><button id="more" hidden>加载更多</button><button id="logout" hidden>退出管理</button>
<script>
const $=id=>document.getElementById(id);let cursor=null;
async function api(path,options={}){const r=await fetch('/api/admin/'+path,options);const b=await r.json();if(!r.ok)throw Error(b.error);return b;}
async function list(append=false){try{const b=await api('feedback'+(append&&cursor?'?cursor='+cursor:''));if(!append)$('reports').replaceChildren();for(const f of b.items){const a=document.createElement('article');const h=document.createElement('h2');h.textContent='#'+f.id+' · '+(f.version||'未填写版本');a.append(h);const p=document.createElement('p');p.textContent=f.description;a.append(p);for(const id of f.images){const img=document.createElement('img');img.src='/api/admin/images/'+id;img.alt='反馈截图';const link=document.createElement('a');link.href=img.src;link.target='_blank';link.append(img);a.append(link);}const s=document.createElement('select');for(const [value,name] of [['open','待处理'],['in_progress','处理中'],['fixed','已修复']]){const o=new Option(name,value);s.add(o);}s.value=f.status;const v=document.createElement('input');v.placeholder='修复版本';v.value=f.fixed_version;const label=document.createElement('label');const hidden=document.createElement('input');hidden.type='checkbox';hidden.checked=!!f.hidden;label.append(hidden,' 隐藏');const save=document.createElement('button');save.textContent='保存';save.onclick=async()=>{try{await api('feedback/'+f.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value,fixed_version:v.value,hidden:hidden.checked})});$('message').textContent='#'+f.id+' 已保存';}catch(e){$('message').textContent=e.message;}};a.append(document.createElement('br'),s,v,label,save);$('reports').append(a);}cursor=b.next_cursor;$('more').hidden=!cursor;$('login').hidden=true;$('logout').hidden=false;}catch(e){$('message').textContent=e.message;}}
$('login').onsubmit=async e=>{e.preventDefault();try{await api('login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});$('password').value='';$('message').textContent='';await list();}catch(e){$('message').textContent=e.message;}};
$('more').onclick=()=>list(true);$('logout').onclick=async()=>{await api('logout',{method:'POST'});location.reload();};
list();
</script></html>
